server:
  port: 8081

spring:
  application:
    name: consolidation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cash_flow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:docker}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: consolidation
        format_sql: true
  flyway:
    enabled: true
    schemas: consolidation
    default-schema: consolidation
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: ${RABBITMQ_CONCURRENCY:4}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:16}
        prefetch: 20

timezone: America/Sao_Paulo

app:
  security:
    jwt:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
