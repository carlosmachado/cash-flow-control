server:
  port: 8080

spring:
  application:
    name: transaction-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cash_flow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:docker}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: transaction
        format_sql: true
  flyway:
    enabled: true
    schemas: transaction
    default-schema: transaction
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

timezone: America/Sao_Paulo

outbox:
  dispatch:
    fixed-delay: 5000

app:
  security:
    jwt:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
