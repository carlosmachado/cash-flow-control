global:
  scrape_interval: 10s

scrape_configs:
  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8080"]

  - job_name: consolidation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["consolidation-service:8081"]
